[workspace]
resolver = "2"
members = [
    "src/scm-core",
    "src/scm-device",
    "src/scm-controller",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Daniele Olmisani"]
license = "MIT"
repository = "https://github.com/mad4j/scm"
homepage = "https://github.com/mad4j/scm"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Testing
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
